# node, gh and git-town are inherited from the repo root (../mise.toml).
# node is only needed by the docs site, which requires >=20.

[tools]
pnpm = "10.28.1" # docs site; its `packageManager` field says 10.22.0

rust = "1.92.0"
"cargo:cargo-nextest" = "0.9.122"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]

[tasks.start]
description = "Run all services"
depends = ["docker:start", "build"]
wait_for = ["docker:start", "build"]
run = [{ task = "service:*" }]

# Named to match the other projects so the root `mise lint` / `mise install`
# aggregates reach this workspace too.
[tasks.lint]
description = "Lint code and find issues"
depends = ["check"]

[tasks."install:frozen"]
description = "Fetch dependencies (don't update lockfile)"
run = "cargo fetch --locked"

[env]
BUILDER = "cargo"
SYSTEM_DEPS_DAV1D_BUILD_INTERNAL = "auto" # enable building dav1d iff the system doesn't have a new enough version
DOCKER_NETWORK_NAME = "stoatchat_default"
DATABASE_PORT = "27017"
RABBIT_PORT = "5672"
REDIS_PORT = "6379"
_.file = { path = ".env", tools = true }
