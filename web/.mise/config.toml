# node, gh and git-town are inherited from the repo root (../mise.toml).

[tools]
deno = "2.8.1"
pnpm = "11.3.0" # matches the `packageManager` field and pnpm-lock.yaml

mdbook = "0.5.3"
"github:lzanini/mdbook-katex" = "0.10.0-alpha-binaries"

[tasks.check]
description = "Task group for CI checks"
run = [
    { task = "install:frozen" },
    { task = "build:deps" },
    { task = "build" },
    { tasks = [
        "lint",
        "*:check",
    ] },
    { task = "format" },
    { task = "test:e2e:install-deps" },
    { tasks = [
        "test:e2e",
    ] },
]

